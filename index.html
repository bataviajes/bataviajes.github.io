html,body{height:100%}
body{background:var(--pat) 0 0/170px 170px repeat,linear-gradient(180deg,var(--sky),var(--bg) 55%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.avatar{width:46px;height:46px;border-radius:50%;background:#fff;flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--accent-soft)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.welcome{align-self:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 10px}
.welcome img{width:min(190px,52vw);aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 12px 30px -14px rgba(12,33,72,.55),0 0 0 4px var(--surface)}
.welcome span{font:500 13px var(--f-body);color:var(--muted);background:var(--glass);padding:4px 12px;border-radius:999px}
.who{min-width:0}
.who b{display:block;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.who span{font-size:13px;color:var(--muted)}
.who span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wa);margin-right:6px;vertical-align:1px}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 13px var(--f-body);cursor:pointer}
.progress{height:3px;background:var(--line);margin:0 max(16px,env(safe-area-inset-left,0px));border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-line;overflow-wrap:anywhere}
.bot{background:var(--surface);border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 1px 0 var(--line)}
.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;align-self:flex-end;font-weight:500}
.gap{height:6px}
.new{animation:pop .28s ease both}
@keyframes pop{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#dock{background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:62%;overflow-y:auto}
#dock:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font:500 15px var(--f-body);cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip:hover{border-color:var(--accent)}
.chip .flag{font-size:18px;line-height:1;margin-right:7px;vertical-align:-2px}
.route .flag{display:block;font-size:26px;line-height:1;margin-bottom:4px}
.row{display:flex;gap:8px}
input,textarea{flex:1;min-width:0;width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font:16px var(--f-body)}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:0 18px;font:600 15px var(--f-body);cursor:pointer;min-height:48px}
.send:disabled{opacity:.4;cursor:default}
.wide{width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.stepper:last-of-type{border-bottom:0}
.stepper b{display:block;font-weight:600}
.stepper small{color:var(--muted);font-size:13px}
.ctl{display:flex;align-items:center;gap:14px}
.ctl button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.ctl button:disabled{opacity:.35}
.ctl output{font:500 18px var(--f-mono);min-width:20px;text-align:center}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:#C2410C}

/* Tarjeta de embarque */
.pass{align-self:stretch;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(15,34,51,.5)}
.pass-top{background:var(--accent);color:var(--accent-ink);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pass-top small{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:18px 18px 6px}
.route .city{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
.route .city:last-child{text-align:right}
.route svg{width:26px;height:26px;color:var(--accent)}
.lbl{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:14px 18px 18px}
.fields div{min-width:0}
.fields p{margin:3px 0 0;font-weight:600;overflow-wrap:anywhere}
.fields .full{grid-column:1/-1}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.perf::before{left:-26px}.perf::after{right:-26px}
.stub{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;font-family:var(--f-mono);font-size:13px}
.stub .code{background:var(--sun);color:#2A1C00;border-radius:6px;padding:3px 8px;font-weight:500}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;padding:14px;font:600 16px var(--f-body);text-decoration:none;cursor:pointer;border:0}
.btn.wa{background:var(--wa);color:#fff}
.btn.sec{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:20px;height:20px}
.copybox{font:13px var(--f-mono);white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;max-height:180px;overflow:auto}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    w:{type:"multi", opts:["Vuelo","Hotel","Traslados","Asistencia al viajero","Excursiones","Alquiler de auto"], min:1} },
  { id:"presupuesto", ask:()=>["¿Tenés un presupuesto aproximado por persona?"],
    w:{type:"chips", opts:["Hasta USD 1.000","USD 1.000 a 2.500","USD 2.500 a 5.000","Más de USD 5.000","Prefiero no decir"]} },
  { id:"prefs", ask:()=>["¿Alguna preferencia? Es opcional."], w:{type:"prefs", opts:["Solo vuelos directos","Máximo 1 escala","Horarios de día","Pago en cuotas","Tarifa con cambios"]} },
  { id:"contacto", ask:()=>[`Última: ¿a qué WhatsApp te escribe ${CONFIG.agente}?`],
    w:{type:"text", ph:"Ej: 11 2345 6789", inputmode:"tel"} },
];

function answerText(step){
  const v = data[step.id];
  switch(step.id){
    case "fechas": return fechasText();
    case "pax": return paxText();
    case "incluye": return v.join(", ");
    case "prefs": return [...(v.tags||[]), v.notas].filter(Boolean).join(" · ") || "Sin preferencias";
    case "origen": case "destino": return withFlag(v);
    default: return v;
  }
}
function fechasText(){
  const f = data.fechas||{}, n = f.noches ? ` · ${f.noches} noches aprox.` : "";
  if(data.flex==="Fechas exactas" || data.flex==="Flexible ± 3 días") return `Ida ${fmtDate(f.ida)}` + (roundTrip() && f.vuelta ? ` · Vuelta ${fmtDate(f.vuelta)}` : "") + (data.flex==="Flexible ± 3 días" ? " (± 3 días)" : "");
  if(data.flex==="Solo sé el mes") return `En ${fmtMonth(f.mes)}${n}`;
  return `Entre el ${fmtDate(f.desde)} y el ${fmtDate(f.hasta)}${n}`;
}
function paxText(){
  const p = data.pax, parts = [plural(p.adultos,"adulto","adultos")];
  if(p.ninos) parts.push(plural(p.ninos,"niño","niños") + (p.edades ? ` (${p.edades})` : ""));
  if(p.bebes) parts.push(plural(p.bebes,"bebé","bebés"));
  return parts.join(", ");
}

const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt!=null) e.textContent = txt; return e; };
const val = x => typeof x === "function" ? x() : x;

function render(animate){
  chat.innerHTML = "";
  const wl = el("div","welcome"), img = el("img"); img.src = BADGE; img.alt = CONFIG.agencia + " · " + CONFIG.agente;
  wl.append(img, el("span",null,CONFIG.lema)); chat.append(wl);
  history.forEach(i => {
    STEPS[i].ask().forEach(t => chat.append(el("div","msg bot",t)));
    chat.append(el("div","msg me",answerText(STEPS[i])));
    chat.append(el("div","gap"));
  });
  bar.style.width = (history.length / STEPS.length * 100) + "%";
  backBtn.hidden = history.length === 0;
  if(current >= STEPS.length){ showSummary(animate); return; }
  STEPS[current].ask().forEach(t => chat.append(el("div","msg bot"+(animate?" new":""),t)));
  buildWidget(STEPS[current]);
  scrollEnd();
}
function scrollEnd(){ requestAnimationFrame(()=>{ chat.scrollTop = chat.scrollHeight; }); }

function next(value){
  data[STEPS[current].id] = value;
  history.push(current);
  current++;
  while(current < STEPS.length && STEPS[current].skip && STEPS[current].skip()) current++;
  dock.innerHTML = "";
  render(false);
  const t = el("div","msg bot typing"); t.innerHTML = "<i></i><i></i><i></i>";
  chat.append(t); scrollEnd();
  setTimeout(()=>render(true), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450);
}
backBtn.onclick = () => { if(!history.length) return; current = history.pop(); render(true); };

function buildWidget(step){
  dock.innerHTML = "";
  const w = step.w;
  if(w.type==="text"){
    const sugg = val(w.sugg)||[], append = val(w.append);
    const f = el("form","row"), i = el("input"); i.id = "in-"+step.id; i.placeholder = val(w.ph);
    let c, empty;
    if(sugg.length){
      c = el("div","chips");
      sugg.forEach(s => {
        const b = el("button","chip"); b.type="button"; b.dataset.k = norm(s);
        if(flagOf(s)) b.append(el("span","flag",flagOf(s)));
        b.append(document.createTextNode(s));
        if(data[step.id]===s) b.setAttribute("aria-pressed","true");
        b.onclick = () => {
          if(!append) return next(s);
          const list = i.value.split(",").map(x=>x.trim()).filter(Boolean);
          if(!list.includes(s)) list.push(s);
          i.value = list.join(", "); b.setAttribute("aria-pressed","true");
        };
        c.append(b);
      });
      empty = el("div","hint"); empty.hidden = true;
      if(w.filter && !append){
        i.oninput = () => {
          const q = norm(i.value.trim()); let shown = 0;
          c.querySelectorAll(".chip").forEach(b => { const ok = !q || b.dataset.k.includes(q); b.hidden = !ok; if(ok) shown++; });
          empty.hidden = !!shown || !q;
          empty.textContent = `Tocá Enviar para usar “${i.value.trim()}”.`;
        };
      }
      dock.append(f, c, empty);
    } else dock.append(f);
    if(w.inputmode){ i.inputMode = w.inputmode; i.type = "tel"; i.autocomplete = "tel"; }
    if(step.id==="nombre") i.autocomplete = "name";
    if(data[step.id] && !sugg.includes(data[step.id])) i.value = data[step.id];
    const b = el("button","send","Enviar"); b.type="submit";
    f.append(i,b);
    f.onsubmit = e => { e.preventDefault(); const v = i.value.trim(); if(v.length < (step.id==="contacto"?6:2)){ i.focus(); return; } next(v); };
    if(!sugg.length) setTimeout(()=>i.focus({preventScroll:true}),50);
  }
  if(w.type==="chips"){
    const c = el("div","chips");
    w.opts.forEach(o => { const b = el("button","chip",o); b.type="button"; if(data[step.id]===o) b.setAttribute("aria-pressed","true"); b.onclick=()=>next(o); c.append(b); });
    dock.append(c);
  }
  if(w.type==="multi" || w.type==="prefs"){
    const prev = w.type==="prefs" ? (data.prefs?.tags||[]) : (data[step.id]||["Vuelo"]);
    const sel = new Set(prev), c = el("div","chips");
    const go = el("button","send wide","Continuar"); go.type="button";
    const sync = () => { if(w.min) go.disabled = sel.size < w.min; };
    w.opts.forEach(o => { const b = el("button","chip",o); b.type="button"; b.setAttribute("aria-pressed", sel.has(o));
      b.onclick=()=>{ sel.has(o)?sel.delete(o):sel.add(o); b.setAttribute("aria-pressed", sel.has(o)); sync(); }; c.append(b); });
    dock.append(c);
    let ta;
    if(w.type==="prefs"){ ta = el("textarea"); ta.id="in-notas"; ta.placeholder="Algo más que deba saber (aerolínea preferida, millas, motivo del viaje…)"; ta.value = data.prefs?.notas||""; dock.append(ta); }
    sync(); dock.append(go);
    go.onclick = () => next(w.type==="prefs" ? {tags:[...sel], notas:ta.value.trim()} : w.opts.filter(o=>sel.has(o)));
  }
  if(w.type==="dates") datesWidget();
  if(w.type==="pax") paxWidget();
  scrollEnd();
}

function field(label, type, id, value, attrs={}){
  const l = el("label","f",label), i = el("input"); i.type = type; i.id = id; if(value) i.value = value;
  Object.assign(i, attrs); l.append(i); return [l,i];
}
function datesWidget(){
  const f = data.fechas||{}, g = el("div","grid2"), err = el("div","err"); err.hidden = true;
  const go = el("button","send wide","Continuar"); go.type="button";
  let get, check;
  if(data.flex==="Fechas exactas" || data.flex==="Flexible ± 3 días"){
    const [l1,ida] = field("Ida","date","in-ida",f.ida,{min:today}); g.append(l1);
    let vuelta; if(roundTrip()){ const [l2,v] = field("Vuelta","date","in-vuelta",f.vuelta,{min:today}); vuelta=v; g.append(l2); ida.onchange=()=>{ vuelta.min = ida.value||today; }; }
    get = () => ({ida:ida.value, vuelta:vuelta?.value});
    check = d => !d.ida ? "Elegí la fecha de ida." : (roundTrip() && !d.vuelta) ? "Elegí la fecha de vuelta." : (d.vuelta && d.vuelta < d.ida) ? "La vuelta tiene que ser después de la ida." : "";
  } else if(data.flex==="Solo sé el mes"){
    const [l1,mes] = field("Mes","month","in-mes",f.mes,{min:today.slice(0,7)}); g.append(l1);
    let noches; if(roundTrip()){ const [l2,n] = field("Noches aprox.","number","in-noches",f.noches,{min:1,max:90,inputMode:"numeric",placeholder:"Ej: 10"}); noches=n; g.append(l2); }
    get = () => ({mes:mes.value, noches:noches?.value});
    check = d => !d.mes ? "Elegí el mes." : "";
  } else {
    const [l1,desde] = field("Desde","date","in-desde",f.desde,{min:today}), [l2,hasta] = field("Hasta","date","in-hasta",f.hasta,{min:today});
    desde.onchange=()=>{ hasta.min = desde.value||today; };
    g.append(l1,l2);
    let noches; if(roundTrip()){ const [l3,n] = field("Noches aprox.","number","in-noches",f.noches,{min:1,max:90,inputMode:"numeric",placeholder:"Ej: 10"}); noches=n; l3.style.gridColumn="1/-1"; g.append(l3); }
    get = () => ({desde:desde.value, hasta:hasta.value, noches:noches?.value});
    check = d => (!d.desde||!d.hasta) ? "Completá las dos fechas." : d.hasta < d.desde ? "La fecha “hasta” tiene que ser posterior." : "";
  }
  dock.append(g, err, go);
  go.onclick = () => { const d = get(), m = check(d); if(m){ err.textContent = m; err.hidden = false; return; } next(d); };
}

function paxWidget(){
  const p = Object.assign({adultos:1, ninos:0, bebes:0, edades:""}, data.pax||{});
  const rows = [["adultos","Adultos","12 años o más",1,9],["ninos","Niños","2 a 11 años",0,8],["bebes","Bebés","Menores de 2 años",0,9]];
  const wrap = el("div"), edadesL = el("label","f","Edades de los niños"), edades = el("input");
  edades.id="in-edades"; edades.placeholder="Ej: 4 y 9"; edades.value = p.edades; edadesL.append(edades);
  const hint = el("div","hint","Cada bebé viaja a upa de un adulto.");
  const outs = {};
  const refresh = () => {
    if(p.bebes > p.adultos) p.bebes = p.adultos;
    rows.forEach(([k,, ,min,max]) => { outs[k].o.value = p[k]; outs[k].m.disabled = p[k] <= min; outs[k].p.disabled = p[k] >= (k==="bebes" ? Math.min(max,p.adultos) : max); });
    edadesL.hidden = !p.ninos;
  };
  rows.forEach(([k,t,s]) => {
    const r = el("div","stepper"), info = el("div"); info.append(el("b",null,t), el("small",null,s));
    const ctl = el("div","ctl"), m = el("button",null,"−"), o = el("output"), pl = el("button",null,"+");
    m.type = pl.type = "button"; m.setAttribute("aria-label","Quitar "+t.toLowerCase()); pl.setAttribute("aria-label","Agregar "+t.toLowerCase());
    m.onclick=()=>{ p[k]--; refresh(); }; pl.onclick=()=>{ p[k]++; refresh(); };
    ctl.append(m,o,pl); r.append(info,ctl); wrap.append(r); outs[k] = {o,m,p:pl};
  });
  const go = el("button","send wide","Continuar"); go.type="button";
  go.onclick = () => { p.edades = p.ninos ? edades.value.trim() : ""; next({...p}); };
  dock.append(wrap, edadesL, hint, go); refresh();
}

function buildMessage(){
  const L = [
    "✈️ *Nueva consulta de viaje*", "",
    `*Nombre:* ${data.nombre}`,
    `*WhatsApp:* ${data.contacto}`,
    `*Tipo:* ${data.tipo}`,
    `*Origen:* ${withFlag(data.origen)}`,
    `*Destino:* ${withFlag(data.destino)}`,
    `*Fechas:* ${fechasText()}` + (data.flex==="Flexible ± 3 días" ? "" : ` (${data.flex.toLowerCase()})`),
    `*Pasajeros:* ${paxText()}`,
    `*Equipaje:* ${data.equipaje}`,
    ...(roundTrip() && data.extra ? [`*Valija extra a la vuelta:* ${data.extra}`] : []),
    `*Clase:* ${data.clase}`,
    `*Incluir:* ${data.incluye.join(", ")}`,
    `*Presupuesto por persona:* ${data.presupuesto}`
  ];
  if(data.prefs.tags.length) L.push(`*Preferencias:* ${data.prefs.tags.join(", ")}`);
  if(data.prefs.notas) L.push(`*Comentarios:* ${data.prefs.notas}`);
  L.push("", `Consulta N° ${data._code}`);
  return L.join("\n");
}

function showSummary(animate){
  dock.innerHTML = "";
  if(!data._code) data._code = Date.now().toString(36).slice(-5).toUpperCase();
  chat.append(el("div","msg bot"+(animate?" new":""), `¡Listo, ${data.nombre.split(" ")[0]}! Revisá que esté todo bien y mandáselo a ${CONFIG.agente} con el botón verde.`));
  const pass = el("div","pass"+(animate?" new":""));
  const top = el("div","pass-top"); top.append(el("small",null,CONFIG.agencia), el("small",null,data.tipo));
  const route = el("div","route");
  const city = name => { const d = el("div","city"); if(flagOf(name)) d.append(el("span","flag",flagOf(name))); d.append(document.createTextNode(name.includes(", ") ? withFlag(name) : name)); return d; };
  route.append(city(data.origen));
  const plane = document.createElementNS("http://www.w3.org/2000/svg","svg"); plane.setAttribute("viewBox","0 0 24 24"); plane.setAttribute("fill","currentColor");
  plane.innerHTML = '<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/>';
  route.append(plane, city(data.destino));
  const fields = el("div","fields");
  const add = (l,v,full) => { const d = el("div",full?"full":null); d.append(el("div","lbl",l), el("p",null,v)); fields.append(d); };
  add("Pasajero", data.nombre); add("Pasajeros", paxText());
  add("Fechas", fechasText(), true);
  add("Equipaje", data.equipaje); add("Clase", data.clase);
  if(roundTrip() && data.extra) add("Valija extra a la vuelta", data.extra, true);
  add("Incluye", data.incluye.join(", ")); add("Presupuesto p/p", data.presupuesto);
  const pr = [...data.prefs.tags, data.prefs.notas].filter(Boolean).join(" · "); if(pr) add("Preferencias", pr, true);
  const stub = el("div","stub"); stub.append(el("span",null,"CONSULTA N°"), el("span","code",data._code));
  pass.append(top, route, fields, el("div","perf"), stub);
  chat.append(pass);

  const msg = buildMessage();
  const a = el("a","btn wa"); a.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
  a.append(document.createTextNode("Enviar a " + CONFIG.agente));
  const cp = el("button","btn sec","Copiar resumen"); cp.type="button";
  const box = el("div","copybox",msg); box.hidden = true;
  cp.onclick = () => {
    const done = () => { cp.textContent = "Copiado"; setTimeout(()=>cp.textContent="Copiar resumen",1800); };
    try { navigator.clipboard.writeText(msg).then(done, ()=>{ box.hidden=false; selectBox(); }); } catch(e){ box.hidden=false; selectBox(); }
  };
  const selectBox = () => { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  const fix = el("button","btn sec","Corregir algo"); fix.type="button"; fix.onclick = () => backBtn.click();
  const act = el("div","actions"); act.append(a, cp, fix);
  const note = el("div","hint", "Si el botón no abre WhatsApp, copiá el resumen y pegalo en el chat con " + CONFIG.agente + (CONFIG.whatsapp ? ` (+${CONFIG.whatsapp}).` : "."));
  dock.append(act, box, note);
  scrollEnd();
}

render(true);
</script>

</body>
</html>
